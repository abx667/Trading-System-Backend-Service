server:
  port: 8084

spring:
  application:
    name: trade-order-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/master

  datasource:
    url: jdbc:mysql://localhost:3306/trade_orders
    username: root
    password: Abir@4545

springdoc:
 api-docs:
  path: /v3/api-docs
 swagger-ui:
  path: /swagger-ui.html

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: false
  instance:
    prefer-ip-address: true
    instance-id: "${spring.application.name}:${spring.application.instance_id:${random.value}}"

keycloak:
  issuer: http://localhost:8080/realms/master
  realm: master
