server:
  port: 7060

spring:
  application:
    name: gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      server:
        webflux:

          # =========================================================
          # Global CORS Configuration
          # =========================================================
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "${GATEWAY_ORIGIN:http://localhost:7060}"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"

          # =========================================================
          # Eureka Service Discovery
          # =========================================================
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:

            # =========================================================
            # Swagger / OpenAPI Routes
            # IMPORTANT: Keep these BEFORE the normal API routes
            # =========================================================

            - id: trading-company-swagger
              uri: lb://TRADING-COMPANY-SERVICE
              predicates:
                - Path=/trading-companies/v3/api-docs
              filters:
                - RewritePath=/trading-companies/v3/api-docs, /v3/api-docs

            - id: trader-swagger
              uri: lb://TRADER-SERVICE
              predicates:
                - Path=/traders/v3/api-docs
              filters:
                - RewritePath=/traders/v3/api-docs, /v3/api-docs

            - id: asset-swagger
              uri: lb://ASSET-SERVICE
              predicates:
                - Path=/assets/v3/api-docs
              filters:
                - RewritePath=/assets/v3/api-docs, /v3/api-docs

            - id: trade-order-swagger
              uri: lb://TRADE-ORDER-SERVICE
              predicates:
                - Path=/orders/v3/api-docs
              filters:
                - RewritePath=/orders/v3/api-docs, /v3/api-docs

            - id: settlement-swagger
              uri: lb://SETTLEMENT-SERVICE
              predicates:
                - Path=/settlements/v3/api-docs
              filters:
                - RewritePath=/settlements/v3/api-docs, /v3/api-docs


            # =========================================================
            # Direct /api Routes
            # Used by Central Swagger "Try it out"
            # =========================================================

            - id: trading-company-api
              uri: lb://TRADING-COMPANY-SERVICE
              predicates:
                - Path=/api/trading-companies/**
              filters:
                - RemoveRequestHeader=Origin

            - id: trader-api
              uri: lb://TRADER-SERVICE
              predicates:
                - Path=/api/traders/**
              filters:
                - RemoveRequestHeader=Origin

            - id: asset-api
              uri: lb://ASSET-SERVICE
              predicates:
                - Path=/api/assets/**
              filters:
                - RemoveRequestHeader=Origin

            - id: trade-order-api
              uri: lb://TRADE-ORDER-SERVICE
              predicates:
                - Path=/api/orders/**
              filters:
                - RemoveRequestHeader=Origin

            - id: settlement-api
              uri: lb://SETTLEMENT-SERVICE
              predicates:
                - Path=/api/settlements/**
              filters:
                - RemoveRequestHeader=Origin


            # =========================================================
            # Normal External API Routes
            # These are the clean Gateway URLs for clients
            # =========================================================

            - id: trading-company-service
              uri: lb://TRADING-COMPANY-SERVICE
              predicates:
                - Path=/trading-companies/**
              filters:
                - RewritePath=/trading-companies(?<segment>/?.*), /api/trading-companies${segment}

            - id: trader-service
              uri: lb://TRADER-SERVICE
              predicates:
                - Path=/traders/**
              filters:
                - RewritePath=/traders(?<segment>/?.*), /api/traders${segment}

            - id: asset-service
              uri: lb://ASSET-SERVICE
              predicates:
                - Path=/assets/**
              filters:
                - RewritePath=/assets(?<segment>/?.*), /api/assets${segment}

            - id: trade-order-service
              uri: lb://TRADE-ORDER-SERVICE
              predicates:
                - Path=/orders/**
              filters:
                - RewritePath=/orders(?<segment>/?.*), /api/orders${segment}

            - id: settlement-service
              uri: lb://SETTLEMENT-SERVICE
              predicates:
                - Path=/settlements/**
              filters:
                - RewritePath=/settlements(?<segment>/?.*), /api/settlements${segment}


  # =========================================================
  # Gateway Resource Server Security
  # =========================================================

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/trading-system}


# =============================================================
# Central Swagger UI
# =============================================================

springdoc:
  swagger-ui:
    path: /swagger-ui.html

    urls:
      - name: Trading Company Service
        url: /trading-companies/v3/api-docs

      - name: Trader Service
        url: /traders/v3/api-docs

      - name: Asset Service
        url: /assets/v3/api-docs

      - name: Trade Order Service
        url: /orders/v3/api-docs

      - name: Settlement Service
        url: /settlements/v3/api-docs


# =============================================================
# Eureka
# =============================================================

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true


# =============================================================
# Logging
# =============================================================

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO