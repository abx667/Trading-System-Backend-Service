server:
  port: 8765

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  
  cloud:
    gateway:
      server:
        webflux:

          # ✅ CORS for Gateway (WebFlux)
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:4200"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

          routes:
            # 1) Prefix route: /HOSPITALMANGEMENTAPI/** -> forwards to service without the prefix
            - id: TRADING-COMPANY-SERVICE_PREFIX
              uri: lb://TRADING-COMPANY-SERVICE
              predicates:
                - Path=/TRADING-COMPANY-SERVICE/**
              filters:
                - StripPrefix=1

            - id: TRADER-SERVICE_PREFIX
              uri: lb://TRADER-SERVICE
              predicates:
                - Path=/TRADER-SERVICE/**
              filters:
                - StripPrefix=1

            - id: ASSET-SERVICE_PREFIX
              uri: lb://ASSET-SERVICE
              predicates:
                - Path=/ASSET-SERVICE/**
              filters:
                - StripPrefix=1

            - id: TRADE-ORDER-SERVICE_PREFIX
              uri: lb://TRADE-ORDER-SERVICE
              predicates:
                - Path=/TRADE-ORDER-SERVICE/**
              filters:
                - StripPrefix=1	

            - id: SETTLEMENT-SERVICE_PREFIX
              uri: lb://SETTLEMENT-SERVICE
              predicates:
                - Path=/SETTLEMENT-SERVICE/**
              filters:
                - StripPrefix=1


            # 2) Direct route: no prefix, forward as-is
            - id: TRADING-COMPANY-SERVICE_DIRECT
              uri: lb://TRADING-COMPANY-SERVICE
              predicates:
                - Path=/swagger-ui.html,/v3/api-docs/**,/swagger-ui/**,/users/**,/roles/**

            - id: TRADER-SERVICE_DIRECT
              uri: lb://TRADER-SERVICE
              predicates:
                - Path=/swagger-ui.html,/v3/api-docs/**,/swagger-ui/**,/users/**,/roles/**

            - id: ASSET-SERVICE_DIRECT
              uri: lb://ASSET-SERVICE
              predicates:
                - Path=/swagger-ui.html,/v3/api-docs/**,/swagger-ui/**,/users/**,/roles/**

            - id: TRADE-ORDER-SERVICE_DIRECT
              uri: lb://TRADE-ORDER-SERVICE
              predicates:
                - Path=/swagger-ui.html,/v3/api-docs/**,/swagger-ui/**,/users/**,/roles/**

            - id: SETTLEMENTSERVICE_DIRECT
              uri: lb://SETTLEMENT-SERVICE
              predicates:
                - Path=/swagger-ui.html,/v3/api-docs/**,/swagger-ui/**,/users/**,/roles/**

            


          discovery:
            locator:
              enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
springdoc:
   swagger-ui:
     disable-swagger-default-url: true